[package]
name = "msfs-flight-tracker"
version = "1.7.1"
edition = "2021"
description = "Native MSFS flight tracker, landing analyzer and logbook"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
