[package]
name = "msfs-flight-tracker-setup"
version = "1.7.1"
edition = "2021"
description = "Installer for MSFS Flight Tracker"
publish = false

[[bin]]
name = "msfs-flight-tracker-setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
